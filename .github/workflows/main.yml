name: CI
on: [push, pull_request, workflow_dispatch]

jobs:
  package:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Haxelib source
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'vision-release'
          New-Item -ItemType Directory -Path $stage -ErrorAction Stop | Out-Null
          Copy-Item extraParams.hxml, CHANGELOG.md, LICENSE, README.md, haxelib.json, hxformat.json, src, native -Destination $stage -Recurse -ErrorAction Stop
          Copy-Item tests/ci/cppia -Destination (Join-Path $stage 'cppia') -Recurse -ErrorAction Stop
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath vision.zip -ErrorAction Stop
      - uses: actions/upload-artifact@v4
        with:
          name: vision-haxelib
          path: vision.zip

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        haxe-version: [4.3.7]
        target: [interp, neko, hl, js, cpp, jvm, python, lua, php, cs, java, cppia]
        include:
          - target: interp
            flag: --interp
            output: ""
          - target: neko
            flag: --neko
            output: bin/neko/tests.n
          - target: hl
            flag: --hl
            output: bin/hl/tests.hl
          - target: js
            flag: --js
            output: bin/js/tests.js
          - target: cpp
            flag: --cpp
            output: bin/cpp
          - target: jvm
            flag: --jvm
            output: bin/jvm/tests.jar
          - target: python
            flag: --python
            output: bin/python/tests.py
          - target: lua
            flag: --lua
            output: bin/lua/tests.lua
          - target: php
            flag: --php
            output: bin/php
          - target: cs
            flag: --cs
            output: bin/cs
          - target: java
            flag: --java
            output: bin/java
          - target: cppia
            flag: --cppia
            output: bin/cppia/tests.cppia
    steps:
      - uses: actions/checkout@v4
      - name: Setup Haxe (${{ matrix.haxe-version }})
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ matrix.haxe-version }}

      - name: Ensure haxelib available
        run: |
          if ! command -v haxelib >/dev/null 2>&1; then
            HAXE_BIN="$HAXE_STD_PATH/.."
            if [ -f "$HAXE_BIN/haxelib" ]; then
              chmod +x "$HAXE_BIN/haxelib"
              echo "$HAXE_BIN" >> $GITHUB_PATH
            fi
          fi
          if ! command -v haxelib >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y haxe
          fi
          if ! command -v haxelib >/dev/null 2>&1; then
            echo "haxelib is missing";
            exit 1;
          fi
          haxelib setup "$HAXE_STD_PATH/../lib"

      - name: Setup runtime (all targets)
        timeout-minutes: 15
        run: |
          set -e
          TARGET="${{ matrix.target }}"

          if [ "$TARGET" = "js" ]; then
            if command -v node >/dev/null 2>&1; then
              NODE_VERSION=$(node -v | sed 's/^v//')
            else
              NODE_VERSION=""
            fi
            if [ "${NODE_VERSION%%.*}" != "20" ]; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            node --version
          fi

          if [ "$TARGET" = "neko" ]; then
            sudo apt-get update
            sudo apt-get install -y neko
            neko -version
          fi

          if [ "$TARGET" = "java" ] || [ "$TARGET" = "jvm" ]; then
            if ! command -v java >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y default-jdk-headless
            fi
            java -version
          fi

          if [ "$TARGET" = "python" ]; then
            if ! command -v python >/dev/null 2>&1; then
              echo "Python is missing; GitHub runner should have it preinstalled."
              exit 1
            fi
            python --version
          fi

          if [ "$TARGET" = "php" ]; then
            if ! command -v php >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y php
            fi
            sudo apt-get update
            sudo apt-get install -y php-mbstring
            php -v
          fi

          if [ "$TARGET" = "lua" ] || [ "$TARGET" = "cs" ] || [ "$TARGET" = "hl" ] || [ "$TARGET" = "cpp" ] || [ "$TARGET" = "cppia" ]; then
            sudo apt-get update
            if [ "$TARGET" = "lua" ]; then
              sudo apt-get install -y lua5.3 liblua5.3-dev lua-luv luarocks
              if ! lua -e "require('rex_pcre2')" >/dev/null 2>&1; then
                sudo luarocks install lrexlib-pcre2
              fi
              if ! lua -e "require('lua-utf8')" >/dev/null 2>&1; then
                sudo luarocks install luautf8
              fi
            fi
            if [ "$TARGET" = "cs" ]; then
              sudo apt-get install -y --no-install-recommends mono-runtime mono-mcs libmono-system-io-compression4.0-cil
            fi
            if [ "$TARGET" = "cpp" ] || [ "$TARGET" = "cppia" ]; then
              sudo apt-get install -y build-essential
            fi
            if [ "$TARGET" = "hl" ]; then
              if ! command -v hl >/dev/null 2>&1; then
                if apt-cache show hashlink >/dev/null 2>&1; then
                  sudo apt-get install -y hashlink
                fi
              fi
              if ! command -v hl >/dev/null 2>&1; then
                sudo apt-get install -y git make build-essential libpcre2-dev libpng-dev zlib1g-dev libssl-dev libmbedtls-dev libturbojpeg0-dev libjpeg-turbo8-dev libvorbis-dev libogg-dev libsdl2-dev libgl1-mesa-dev libglu1-mesa-dev libopenal-dev libuv1-dev libsqlite3-dev
                git clone --depth 1 --branch 1.15 https://github.com/HaxeFoundation/hashlink.git /tmp/hashlink
                make -C /tmp/hashlink
                sudo make -C /tmp/hashlink install
                sudo ldconfig
              fi
              hl --version
            fi
          fi

      - name: Set HAXEPATH
        run: |
          echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV
      - name: Install & Set-up Vision
        run: |
          haxelib dev vision $GITHUB_WORKSPACE
          haxelib install utest --quiet
          haxelib install format --quiet
          if [ "${{ matrix.target }}" = "js" ]; then haxelib install hxnodejs --quiet; fi
          haxelib install hxcpp --quiet
          haxelib install hxjava --quiet
          haxelib install hxcs --quiet
      - name: Build hxcpp tools (cppia runtime)
        timeout-minutes: 15
        if: ${{ matrix.target == 'cppia' }}
        run: bash tests/ci/cppia/build-host.sh
      - name: Compile (${{ matrix.target }})
        run: |
          mkdir -p bin
          if [ "${{ matrix.output }}" != "" ]; then
            OUTDIR=$(dirname "${{ matrix.output }}")
            mkdir -p "$OUTDIR"
          fi
          BASE_CMD="haxe --class-path tests/src --main Main --library vision --library format --library utest -D vision_skip_golden -D vision_skip_invalid_tests"
          if [ "${{ matrix.target }}" = "js" ]; then
            BASE_CMD="$BASE_CMD --library hxnodejs"
          fi
          if [ "${{ matrix.target }}" != "lua" ]; then
            BASE_CMD="$BASE_CMD -debug"
          fi
          if [ "${{ matrix.target }}" = "java" ] || [ "${{ matrix.target }}" = "jvm" ]; then
            BASE_CMD="$BASE_CMD --no-inline"
          fi
          if [ "${{ matrix.target }}" = "neko" ]; then
            for BATCH in 1 2 3 4 5 6 7 8; do
              CMD="$BASE_CMD -dce full -D vision_neko_batched -D vision_neko_batch_$BATCH --neko bin/neko/tests-$BATCH.n"
              echo "$CMD"
              $CMD
            done
          elif [ "${{ matrix.target }}" = "interp" ]; then
            CMD="$BASE_CMD --interp"
          elif [ "${{ matrix.output }}" != "" ]; then
            CMD="$BASE_CMD ${{ matrix.flag }} ${{ matrix.output }}"
          else
            CMD="$BASE_CMD ${{ matrix.flag }}"
          fi
          if [ "${{ matrix.target }}" != "neko" ]; then
            echo "$CMD"
            $CMD
          fi

      - name: Verify quiet mode and large image headers
        if: ${{ matrix.target == 'interp' }}
        env:
          VISION_TESTS: SeamCarvingTest,FromBytesTest,TransformationMatrix2DTest
          VISION_TEST_CASES: (quiet|carve|compute)
        run: haxe test.hxml -D vision_quiet -D vision_higher_width_cap

      - name: Run (${{ matrix.target }})
        run: |
          if [ "${{ matrix.target }}" = "js" ]; then
            node bin/js/tests.js
          fi
          if [ "${{ matrix.target }}" = "neko" ]; then
            for BATCH in 1 2 3 4 5 6 7 8; do
              cp "bin/neko/tests-$BATCH.n" "/tmp/tests-$BATCH.n"
              neko "/tmp/tests-$BATCH.n"
            done
          fi
          if [ "${{ matrix.target }}" = "hl" ]; then
            hl bin/hl/tests.hl
          fi
          if [ "${{ matrix.target }}" = "cpp" ]; then
            if [ -x "./bin/cpp/Main" ]; then
              ./bin/cpp/Main
            elif [ -x "./bin/cpp/Main-debug" ]; then
              ./bin/cpp/Main-debug
            else
              echo "CPP executable not found in bin/cpp";
              ls -la bin/cpp
              exit 1
            fi
          fi
          if [ "${{ matrix.target }}" = "jvm" ]; then
            java -jar bin/jvm/tests.jar
          fi
          if [ "${{ matrix.target }}" = "java" ]; then
            if [ -f "bin/java/Main.jar" ]; then
              java -jar bin/java/Main.jar
            elif [ -f "bin/java/Main-Debug.jar" ]; then
              java -jar bin/java/Main-Debug.jar
            else
              java -cp bin/java/obj Main
            fi
          fi
          if [ "${{ matrix.target }}" = "python" ]; then
            python bin/python/tests.py
          fi
          if [ "${{ matrix.target }}" = "lua" ]; then
            lua bin/lua/tests.lua
          fi
          if [ "${{ matrix.target }}" = "php" ]; then
            php bin/php/index.php
          fi
          if [ "${{ matrix.target }}" = "cs" ]; then
            if [ -f "bin/cs/bin/Main.exe" ]; then
              mono bin/cs/bin/Main.exe
            elif [ -f "bin/cs/bin/Main-Debug.exe" ]; then
              mono bin/cs/bin/Main-Debug.exe
            else
              echo "C# executable not found in bin/cs/bin";
              ls -la bin/cs/bin
              exit 1
            fi
          fi
          if [ "${{ matrix.target }}" = "cppia" ]; then
            HXCPP_PATH=$(haxelib path hxcpp | head -n 1 | tr -d '\r')
            haxe --class-path tests/src --main SeamCarvingMain --library vision --library utest -dce full --cppia bin/cppia/seam-tests.cppia
            "$HXCPP_PATH/bin/Linux64/Cppia" bin/cppia/seam-tests.cppia
            "$HXCPP_PATH/bin/Linux64/Cppia" bin/cppia/tests.cppia
          fi
          if [ "${{ matrix.target }}" = "interp" ]; then
            echo "Interp already executed in compile step."
          fi

      - name: Compile the Flash image smoke test
        if: matrix.target == 'interp'
        run: |
          mkdir -p bin/swf
          haxe -cp src -cp tests/ci -main TargetSmoke --swf bin/swf/target.swf -D swf-header=64:64:30:000000

  native-screen:
    name: Screen (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      - name: Build the Screen test
        shell: pwsh
        run: |
          $repo = Join-Path $env:RUNNER_TEMP 'screen-haxelib'
          New-Item -ItemType Directory -Path $repo | Out-Null
          haxelib setup $repo
          haxelib install hxcpp 4.3.2 --always
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          haxelib install utest 1.13.2 --always
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          haxe -cp src -cp tests/src -lib utest -main Main --cpp bin/native-drawing/cpp -D windows -D HXCPP_M64
          exit $LASTEXITCODE
      - name: Run the Screen test
        shell: pwsh
        working-directory: bin/native-drawing/cpp
        run: |
          $env:VISION_TESTS = 'ScreenTest'
          & ./Main.exe
          exit $LASTEXITCODE
      - name: Locate the Windows toolchain and install HashLink
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'hashlink.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'hashlink-sdk'
          Invoke-WebRequest https://github.com/HaxeFoundation/hashlink/releases/download/1.16/hashlink-1.16.0-win.zip -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $runtime = Get-ChildItem -LiteralPath $destination -Recurse -File -Filter hl.exe | Select-Object -First 1
          if (-not $runtime) { throw 'HashLink runtime missing from SDK' }
          "VISION_HASHLINK_ROOT=$($runtime.DirectoryName)" >> $env:GITHUB_ENV
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $visualStudio) { throw 'Microsoft C++ toolchain unavailable' }
          "VISION_MSVC_DEV_CMD=$(Join-Path $visualStudio 'Common7/Tools/VsDevCmd.bat')" >> $env:GITHUB_ENV
      - name: Build and run the HashLink Screen suite
        shell: pwsh
        run: |
          $sdk = $env:VISION_HASHLINK_ROOT
          $source = (Resolve-Path native/hashlink/windows/screen.c).Path
          $env:VISION_TESTS = 'ScreenTest'
          New-Item -ItemType Directory -Path bin/native-drawing/hl -Force | Out-Null
          haxe -cp src -cp tests/src -lib utest -main Main --hl bin/native-drawing/hl/tests.hl -D windows -D vision_hashlink_screen -D hl-ver=1.16.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Push-Location bin/native-drawing/hl
          try {
            cmd /c ('call "{0}" -arch=amd64 >nul && cl /nologo /O2 /std:c11 /LD /I"{1}\include" "{2}" user32.lib gdi32.lib /link /out:vision_screen.hdll' -f $env:VISION_MSVC_DEV_CMD,$sdk,$source)
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & (Join-Path $sdk 'hl.exe') tests.hl
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - name: Compile and run the HashLink C image smoke test
        shell: pwsh
        run: |
          $sdk = $env:VISION_HASHLINK_ROOT
          New-Item -ItemType Directory -Path bin/native-drawing/hlc -Force | Out-Null
          haxe -cp src -cp tests/ci -main TargetSmoke --hl bin/native-drawing/hlc/main.c -D no-compilation -D hl-ver=1.16.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PATH = "$sdk;$env:PATH"
          Push-Location bin/native-drawing/hlc
          try {
            cmd /c ('call "{0}" -arch=amd64 >nul && cl /nologo /Od /I"{1}\include" /I. main.c "{1}\libhl.lib" "{1}\ssl.lib" /Fe:TargetSmoke.exe' -f $env:VISION_MSVC_DEV_CMD,$sdk)
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & ./TargetSmoke.exe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
